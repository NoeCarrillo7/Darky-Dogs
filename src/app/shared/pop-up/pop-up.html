@if (isOpen) {
    <div class="modal-overlay"(click)="cerrar()">
        <div class="modal-content" (click)="$event.stopPropagation()">
        <button class="close-btn" (click)="cerrar()">✕</button>
        
        <picture>
            <source media="(max-width: 767px)" srcset="/assets/pop-up/ubicacion-movil.png">
            
            <img src="/assets/pop-up/ubicacion.png" alt="ubicacion">
        </picture>
    </div>
    </div>
}
